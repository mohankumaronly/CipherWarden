version: "3.9"
services:
  backend:
    build:
      context: ./backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET:-replace_with_64_byte_hex_random_secret_dev_mode}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - COOKIE_NAME=${COOKIE_NAME:-cw_session}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - MASTER_KEY=${MASTER_KEY:-}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
